openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public storefront catalog and protected catalog management.
  - name: admin
    description: Administrator access.
  - name: fragrance-ai
    description: Server-side fragrance data suggestions.
  - name: storage
    description: Product image uploads and delivery.
  - name: seo
    description: Protected site discovery, crawl reports, and SEO audits.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/passcode:
    get:
      operationId: getAdminPasscodeStatus
      tags: [admin]
      summary: Check whether the administrator passcode is unlocked
      responses:
        "200":
          description: Passcode unlock status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasscodeStatus"
    post:
      operationId: unlockAdminPasscode
      tags: [admin]
      summary: Verify the administrator passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasscodeInput"
      responses:
        "200":
          description: Passcode accepted and a short-lived unlock cookie was set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasscodeStatus"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Passcode was not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many passcode attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Passcode verification is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: lockAdminPasscode
      tags: [admin]
      summary: Clear the administrator passcode unlock
      responses:
        "204":
          description: The passcode unlock was cleared.
  /admin/change-password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the administrator password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordChangeInput"
      responses:
        "200":
          description: Password changed and other administrator sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordChangeResponse"
        "400":
          description: The new password does not meet requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The current password was not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Password changes are not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/change-password/session:
    post:
      operationId: resetAdminPasswordFromSession
      tags: [admin]
      summary: Reset the administrator password from an active session
      description: Requires the current administrator unlock session. Replaces the password hash and revokes other admin sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordSessionResetInput"
      responses:
        "200":
          description: Password reset and the current administrator session renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordChangeResponse"
        "400":
          description: The new password does not meet requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: An active administrator session is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Password reset is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/passcode/recover:
    post:
      operationId: recoverAdminPasscode
      tags: [admin]
      summary: Reset the administrator password with the recovery key
      description: Replaces the password hash and revokes existing admin sessions. Requires a server-managed recovery secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordRecoveryInput"
      responses:
        "200":
          description: Password reset and a new administrator session was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordRecoveryResponse"
        "400":
          description: The new password or recovery request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Recovery key was not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many recovery attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Password recovery is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/seo/summary:
    get:
      operationId: getSeoSummary
      tags: [seo]
      summary: Get SEO discovery and sitemap status
      responses:
        "200":
          description: Current catalog discovery and crawl summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoSummary" }
        default: { $ref: "#/components/responses/SeoError" }
  /admin/seo/records:
    get:
      operationId: listSeoRecords
      tags: [seo]
      summary: Search and filter discovered pages and products
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
        - { name: kind, in: query, schema: { type: string, enum: [all, page, product, raw_material], default: all } }
        - { name: issue, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sitemap, in: query, schema: { type: string, enum: [all, included, excluded], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Paginated SEO discovery records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoRecordsPage" }
        default: { $ref: "#/components/responses/SeoError" }
  /admin/seo/crawls:
    get:
      operationId: listSeoCrawls
      tags: [seo]
      summary: List crawl history
      responses:
        "200":
          description: Recent crawl reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoCrawlHistory" }
        default: { $ref: "#/components/responses/SeoError" }
    post:
      operationId: startSeoCrawl
      tags: [seo]
      summary: Start a manual website crawl
      responses:
        "202":
          description: A crawl has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoCrawlRun" }
        default: { $ref: "#/components/responses/SeoError" }
  /admin/seo/crawls/{id}/step:
    post:
      operationId: stepSeoCrawl
      tags: [seo]
      summary: Process the next safe crawl batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated crawl progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoCrawlRun" }
        default: { $ref: "#/components/responses/SeoError" }
  /admin/seo/settings:
    patch:
      operationId: updateSeoSettings
      tags: [seo]
      summary: Enable or disable scheduled crawling
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeoSettingsInput" }
      responses:
        "200":
          description: Updated crawl settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeoSettings" }
        default: { $ref: "#/components/responses/SeoError" }
  /seo/sitemap.xml:
    get:
      operationId: getSeoSitemapIndex
      tags: [seo]
      summary: Serve the public XML sitemap index
      responses:
        "200":
          description: Sitemap index XML.
          content:
            application/xml:
              schema: { type: string }
  /seo/products-sitemap.xml:
    get:
      operationId: getSeoProductsSitemap
      tags: [seo]
      summary: Serve the public product sitemap
      responses:
        "200":
          description: Product sitemap XML.
          content:
            application/xml:
              schema: { type: string }
  /seo/pages-sitemap.xml:
    get:
      operationId: getSeoPagesSitemap
      tags: [seo]
      summary: Serve the public page sitemap
      responses:
        "200":
          description: Page sitemap XML.
          content:
            application/xml:
              schema: { type: string }
  /seo/images-sitemap.xml:
    get:
      operationId: getSeoImagesSitemap
      tags: [seo]
      summary: Serve the public image sitemap
      responses:
        "200":
          description: Image sitemap XML.
          content:
            application/xml:
              schema: { type: string }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List the live storefront catalog
      responses:
        "200":
          description: Products ordered by creation date.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a catalog product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: SKU already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: SKU already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a catalog product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Product deleted.
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /search-fragrance-images:
    post:
      operationId: searchFragranceImages
      tags: [fragrance-ai]
      summary: Search Brave for perfume photographs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutofillFragranceInput"
      responses:
        "200":
          description: Image candidates with source pages for merchant review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragranceImageSearch"
        "400":
          description: Invalid search query.
        "403":
          description: Administrator access required.
        "429":
          description: Search rate limit reached.
        "502":
          description: Image search is unavailable.
  /autofill-fragrance:
    post:
      operationId: autofillFragrance
      tags: [fragrance-ai]
      summary: Generate editable fragrance product suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutofillFragranceInput"
      responses:
        "200":
          description: Suggested fragrance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FragranceSuggestion"
        "400":
          description: Invalid fragrance name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: AI request limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The AI provider returned an invalid response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: AI service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a product image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a product image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders:
    post:
      operationId: createStoreOrder
      tags: [orders]
      summary: Create a guest order using current database prices and stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCheckoutInput"
      responses:
        "201":
          description: Order created and waiting for store confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCheckoutConfirmation"
        "400":
          description: Invalid checkout details, mixed currencies, or unavailable product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Supabase checkout is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /raw-materials:
    get:
      operationId: listRawMaterials
      tags: [raw-materials]
      summary: List published materials priced per gram
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Published raw materials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawMaterial" }
  /raw-materials/{source_id}:
    get:
      operationId: getRawMaterialBySourceId
      tags: [raw-materials]
      summary: Get one published raw material by its public source ID
      parameters:
        - name: source_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Published raw material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterial" }
        "404":
          description: No published raw material has this source ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /admin/raw-materials:
    get:
      operationId: listAdminRawMaterials
      tags: [raw-materials]
      summary: List all raw materials for administration
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: All raw materials.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawMaterial" }
    post:
      operationId: addHillenRawMaterial
      tags: [raw-materials]
      summary: Import one verified Hillen99 product at its original price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HillenMaterialInput" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Imported or already existing material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterial" }
  /admin/raw-materials/{id}:
    patch:
      operationId: updateRawMaterial
      tags: [raw-materials]
      summary: Edit a material without changing the recorded supplier price
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawMaterialUpdate" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Saved material.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterial" }
    delete:
      operationId: deleteRawMaterial
      tags: [raw-materials]
      summary: Delete a raw material
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "204": { description: Deleted. }
  /admin/raw-materials/imports:
    get:
      operationId: listRawMaterialImports
      tags: [raw-materials]
      summary: List previous dry-run and import jobs
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Recent resumable import history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RawMaterialImport" }
    post:
      operationId: createRawMaterialImport
      tags: [raw-materials]
      summary: Start a dry-run or source import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawMaterialImportInput" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "201":
          description: Import job created and saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterialImport" }
  /admin/raw-materials/imports/{id}:
    get:
      operationId: getRawMaterialImport
      tags: [raw-materials]
      summary: Read saved import progress
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Saved job state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterialImport" }
  /admin/raw-materials/imports/{id}/step:
    post:
      operationId: stepRawMaterialImport
      tags: [raw-materials]
      summary: Process or resume the next saved import page
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Latest saved progress after one page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterialImport" }
  /admin/raw-materials/categories:
    get:
      operationId: listHillenRawMaterialCategories
      tags: [raw-materials]
      summary: Discover every non-empty supplier category
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Live supplier categories and product counts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HillenCategory" }
  /admin/raw-materials/research:
    post:
      operationId: researchRawMaterials
      tags: [raw-materials]
      summary: Search Hillen99 and get a grounded AI material summary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RawMaterialQuery" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Verified supplier matches and AI explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RawMaterialResearch" }
  /contact/settings:
    get:
      operationId: getPublicContactSettings
      tags: [contact]
      summary: Read published store hours
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Configured store hours, if set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSettings" }
  /contact/messages:
    post:
      operationId: submitContactMessage
      tags: [contact]
      summary: Save a customer message to the private store inbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageInput" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "201":
          description: The message was saved successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessageReceived" }
  /admin/contact/settings:
    get:
      operationId: getAdminContactSettings
      tags: [contact]
      summary: Read admin-configurable contact settings
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Current contact settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSettings" }
    patch:
      operationId: updateAdminContactSettings
      tags: [contact]
      summary: Update store hours
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactSettingsUpdate" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Updated contact settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactSettings" }
  /admin/contact/messages:
    get:
      operationId: listAdminContactMessages
      tags: [contact]
      summary: List messages in the admin-only inbox
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Most recent contact messages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactMessage" }
  /admin/contact/messages/{id}:
    patch:
      operationId: updateAdminContactMessage
      tags: [contact]
      summary: Mark a contact message as read or unread
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageUpdate" }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "200":
          description: Updated message state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessage" }
    delete:
      operationId: deleteAdminContactMessage
      tags: [contact]
      summary: Delete a contact message from the private inbox
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        default: { $ref: "#/components/responses/RawMaterialError" }
        "204":
          description: Message permanently deleted.
components:
  responses:
    SeoError:
      description: Invalid SEO request, admin access required, or crawl/storage service unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RawMaterialError:
      description: Invalid input, sign-in required, missing material, rate limit, or supplier/AI service unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SeoSettingsInput:
      type: object
      required: [scheduled_enabled]
      properties:
        scheduled_enabled: { type: boolean }
    SeoDiscoveryRecord:
      type: object
      required: [url, canonical_url, page_type, title, description, image_urls, price, currency, http_status, last_checked_at, last_modified, indexable, sitemap_included, issue_codes, category, google_index_status]
      properties:
        url: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
        page_type: { type: string, enum: [page, product, raw_material] }
        title: { type: string }
        description: { type: string }
        image_urls: { type: array, items: { type: string, format: uri } }
        price: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        http_status: { type: [integer, "null"] }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_modified: { type: [string, "null"], format: date-time }
        indexable: { type: boolean }
        sitemap_included: { type: boolean }
        issue_codes: { type: array, items: { type: string } }
        category: { type: [string, "null"] }
        google_index_status: { type: string, enum: [unknown, indexed, not_indexed] }
    SeoCrawlRun:
      type: object
      required: [id, status, started_at, completed_at, scheduled, pages_discovered, products_discovered, raw_materials_discovered, images_discovered, urls_checked, broken_links, crawl_errors, remaining_urls, sitemap_generated_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, complete, partial, failed] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        scheduled: { type: boolean }
        pages_discovered: { type: integer }
        products_discovered: { type: integer }
        raw_materials_discovered: { type: integer }
        images_discovered: { type: integer }
        urls_checked: { type: integer }
        broken_links: { type: integer }
        crawl_errors: { type: array, items: { type: string } }
        remaining_urls: { type: integer }
        sitemap_generated_at: { type: [string, "null"], format: date-time }
    SeoSummary:
      type: object
      required: [pages_discovered, products_discovered, raw_materials_discovered, images_discovered, successful_urls, broken_links, crawl_errors, last_crawl_at, sitemap_generated_at, current_run, scheduled_enabled, google_search_console_connected, verified_indexed_pages]
      properties:
        pages_discovered: { type: integer }
        products_discovered: { type: integer }
        raw_materials_discovered: { type: integer }
        images_discovered: { type: integer }
        successful_urls: { type: integer }
        broken_links: { type: integer }
        crawl_errors: { type: integer }
        last_crawl_at: { type: [string, "null"], format: date-time }
        sitemap_generated_at: { type: [string, "null"], format: date-time }
        current_run: { oneOf: [{ $ref: "#/components/schemas/SeoCrawlRun" }, { type: "null" }] }
        scheduled_enabled: { type: boolean }
        google_search_console_connected: { type: boolean }
        verified_indexed_pages: { type: [integer, "null"] }
    SeoRecordsPage:
      type: object
      required: [items, total, page, per_page, pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SeoDiscoveryRecord" }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        pages: { type: integer }
    SeoCrawlHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SeoCrawlRun" }
    SeoSettings:
      type: object
      required: [scheduled_enabled, interval_hours, site_origin, next_crawl_at]
      properties:
        scheduled_enabled: { type: boolean }
        interval_hours: { type: integer }
        site_origin: { type: string, format: uri }
        next_crawl_at: { type: [string, "null"], format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RawMaterialCandidate:
      type: object
      required: [source_id, source_sku, name, description, source_description, category, source_category, price, currency, image_url, source_url, supplier_available, unit, quantity_options]
      properties:
        source_id: { type: integer }
        source_sku: { type: [string, "null"] }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        currency: { type: string, enum: [USD, IQD] }
        image_url: { type: string }
        source_url: { type: string }
        supplier_available: { type: boolean }
        source_description: { type: string }
        source_category: { type: string }
        unit: { type: string, enum: [g, item] }
        quantity_options:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
              price: { type: number }
              currency: { type: string }
              unit: { type: string }
    RawMaterial:
      allOf:
        - { $ref: "#/components/schemas/RawMaterialCandidate" }
        - type: object
          required: [id, supabase_id, source_name, source_category, source_image_url, source_available, source_price, source_currency, published, imported_at]
          properties:
            id: { type: integer }
            supabase_id: { type: [string, "null"], format: uuid }
            source_name: { type: string }
            source_category: { type: string }
            source_image_url: { type: string }
            source_available: { type: boolean }
            source_price: { type: number }
            source_currency: { type: string, enum: [USD, IQD] }
            published: { type: boolean }
            imported_at: { type: string, format: date-time }
    HillenMaterialInput:
      type: object
      required: [source_id]
      properties:
        source_id: { type: integer, minimum: 1 }
    RawMaterialUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 3000 }
        category: { type: string, minLength: 1, maxLength: 150 }
        price: { type: number, minimum: 0, maximum: 99999999 }
        currency: { type: string, enum: [USD, IQD] }
        published: { type: boolean }
    RawMaterialQuery:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 120 }
    HillenCategory:
      type: object
